<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/crm.css">
    <script type="module" src="./js/auth-page.js"></script>
    <title>Sign Up | 10X CRM</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body class="crm-access" data-page="signup">
    <main class="access-shell">
        <div class="access-brand">
            <p class="access-product">10X CRM</p>
            <p class="access-wordmark">CTRL<span>+ME</span></p>
        </div>

        <section class="access-content" aria-labelledby="access-title">
            <h1 id="access-title">Create your account.</h1>

            <form class="access-form" method="post" novalidate>
                <div class="access-field">
                    <label for="fullName">Full name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="access-field">
                    <label for="email">Email</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        inputmode="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="access-field">
                    <label for="company">
                        Company <span class="access-optional">(optional)</span>
                    </label>
                    <input
                        type="text"
                        id="company"
                        name="company"
                        autocomplete="organization"
                    >
                </div>

                <div class="access-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="access-field">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button class="access-submit" type="submit" disabled>
                    Create account <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="access-switch">
                Already have an account? <a href="index.html">Log in</a>
            </p>
        </section>
    </main>
</body>
</html>
