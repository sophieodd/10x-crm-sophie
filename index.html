<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/crm.css">
    <script type="module" src="./js/auth-page.js"></script>
    <title>Log In | 10X CRM</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body class="crm-access" data-page="login">
    <main class="access-shell">
        <div class="access-brand">
            <p class="access-product">10X CRM</p>
            <p class="access-wordmark">CTRL<span>+ME</span></p>
        </div>

        <section class="access-content" aria-labelledby="access-title">
            <h1 id="access-title">Welcome back.</h1>
            <p class="muted">The shop has a back room. You’re looking at it.</p>

            <form class="access-form" method="post" novalidate>
                <div class="access-field">
                    <label for="email">Email</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        inputmode="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="access-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="access-submit" type="submit" disabled>
                    Log in <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="access-switch">
                Don’t have an account? <a href="signup.html">Sign up</a>
            </p>
        </section>
    </main>
</body>
</html>
